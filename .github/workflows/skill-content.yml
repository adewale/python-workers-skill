name: skill-content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # Same minor version as the Pyodide runtime the examples target
          python-version: '3.12'
      - name: Parse fenced code blocks (python, toml, json, jsonc)
        run: python3 scripts/check_code_blocks.py
