name: install-boundary

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  install-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # check_last_verified.py reads the history of skills/python-workers/
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Same minor version as the Pyodide runtime the skill's examples target,
          # so check_code_blocks.py rejects syntax that Workers cannot run.
          python-version: '3.12'
      - name: Check installable skill boundary
        run: python3 scripts/check_install_boundary.py
      - name: Parse fenced code blocks (python, toml, json, jsonc)
        run: python3 scripts/check_code_blocks.py
      - name: Check last_verified against the last content change
        run: python3 scripts/check_last_verified.py
