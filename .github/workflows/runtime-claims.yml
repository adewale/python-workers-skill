name: runtime-claims

# Runs the probe Worker under real workerd (local D1, nothing deployed) and checks the
# skill's runtime claims. Path-filtered: wrangler is not pinned, so an unrelated PR
# should not turn red when a new wrangler or runtime release changes behaviour.
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/runtime/**'
      - 'scripts/check_runtime_claims.py'
      - '.github/workflows/runtime-claims.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime claims against workerd
        run: python3 scripts/check_runtime_claims.py
